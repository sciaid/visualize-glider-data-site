name: tmp real-time sample (delete me)
on:
  push:
    branches: [tmp-rt-sample]
permissions:
  contents: write
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Download real-time datasets (raw + 5 m grid)
        run: |
          mkdir -p rtsample
          python - <<'PY'
          import sys; sys.path.insert(0, "scripts")
          from pathlib import Path
          import fetch_erddap as F
          rows = F.list_datasets(F.load_config()["institutions"]) if hasattr(F, "load_config") else F.list_datasets()
          chosen = F.choose(rows)
          out = Path("rtsample")
          for dep, row in chosen.items():
              if row["mode"] != "realtime":
                  continue
              did = row["datasetID"]
              info = F.dataset_info(did)
              want = F.BASE_VARS + [v for v in F.SAMPLE_VARS if v in info["variables"]]
              raw = out / f"{dep}_raw.nc"
              url = F.download(did, want, raw)
              g = F.grid_dac(raw, [v for v in F.SAMPLE_VARS if v in info["variables"]])
              F.fill_density(g)
              F.write_grid(g, info, row, url, out / f"{dep}_erddap-realtime-5m.nc")
              print(dep, did, raw.stat().st_size)
          PY
          ls -la rtsample
      - name: Push to tmp-rt-data branch
        run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git checkout --orphan tmp-rt-data
          git rm -rfq --cached .
          git add -f rtsample
          git commit -qm "temporary real-time sample"
          git push -f origin tmp-rt-data
