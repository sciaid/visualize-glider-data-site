# Builds and publishes the site.
#   - on every push to main
#   - daily, to pick up new or updated glider datasets on the IOOS Glider DAC ERDDAP
#   - on demand (Actions > Publish site > Run workflow)
#   - on pull requests: full build including a real ERDDAP download, but nothing is published
# One-time setup on GitHub: Settings > Pages > Build and deployment > Source: "GitHub Actions".
name: Publish site

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Three times a day: GitHub often starts scheduled runs hours late and may drop one, so
    # more than one a day keeps the real-time pages fresh. Times in UTC; Pacific standard time
    # is 5:37 am, 11:37 am and 5:37 pm (an hour later during daylight time).
    - cron: "37 13 * * *"
    - cron: "37 19 * * *"
    - cron: "37 1 * * *"
  workflow_dispatch:

permissions:
  contents: write              # only used by the keep-alive step below
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  # A build on main (scheduled or after a merge) runs to the end and the next one waits;
  # only pull-request builds are replaced by a newer push to the same branch.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      erddap_errors: ${{ steps.erddap.outputs.errors }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt

      # Gridded ERDDAP downloads, kept between runs so only new or changed datasets are fetched
      - uses: actions/cache@v4
        with:
          path: .erddap-cache
          key: erddap-${{ github.run_id }}
          restore-keys: erddap-

      - name: Download new or updated datasets from ERDDAP
        id: erddap
        run: |
          python scripts/fetch_erddap.py .erddap-cache --repo-index viewer/data/index.json
          python - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, pathlib
          p = pathlib.Path(".erddap-cache/ERDDAP/status.json")
          s = json.loads(p.read_text()) if p.exists() else {"errors": ["no status written"]}
          print(f"errors={len(s.get('errors', []))}")
          EOF

      # Currents around the gliders that are out now, for the real-time map. Model currents need the
      # repository secrets COPERNICUSMARINE_SERVICE_USERNAME / _PASSWORD (free Copernicus Marine account);
      # without them only HF radar is shown. Never fails the build.
      - name: Ocean currents for the real-time map
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/fetch_currents.py .erddap-cache currents || echo "currents step failed; map shows gliders only"

      - name: Build site data (ERDDAP deployments are built here, not committed)
        run: python scripts/build_site.py .erddap-cache bathymetry --erddap-status .erddap-cache/ERDDAP/status.json

      # Daily satellite SST and chlorophyll at each deployment's positions, for the strip above the
      # curtain (viewer/data/<name>.sat.json). Cached; a backlog is finished over several builds.
      - name: Satellite match-ups for the curtains
        env:
          COPERNICUSMARINE_SERVICE_USERNAME: ${{ secrets.COPERNICUSMARINE_SERVICE_USERNAME }}
          COPERNICUSMARINE_SERVICE_PASSWORD: ${{ secrets.COPERNICUSMARINE_SERVICE_PASSWORD }}
        run: python scripts/fetch_matchups.py viewer/data .erddap-cache/matchups || echo "match-up step failed; curtains show no satellite strip"

      - name: Data status badges (home and Real-time pages)
        run: python scripts/site_status.py .erddap-cache/ERDDAP currents viewer/data

      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render
        run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub disables scheduled workflows after 60 days without repository activity.
      - name: Keep the daily schedule alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "Keep the daily site build active"
            git push
          fi

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Runs after publishing: fails (so GitHub emails you) if any ERDDAP dataset could not be updated.
  # The site is still published with the previous version of those datasets.
  report:
    needs: [build, deploy]
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Report ERDDAP problems
        run: |
          echo "ERDDAP problems: ${{ needs.build.outputs.erddap_errors }}"
          test "${{ needs.build.outputs.erddap_errors }}" = "0" || {
            echo "Some ERDDAP datasets could not be updated; see the build log ('Download new or updated datasets')."
            exit 1; }
