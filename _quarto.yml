project:
  type: website
  output-dir: _site
  # Pre-built pages and data, copied into the site as they are
  resources:
    - "map/**"
    - "viewer/**"
    - "realtime_map/**"
    - "currents/**"

website:
  title: "ESD glider deployments"
  # "View source" and "Report an issue" links on every page, and a GitHub icon in the top bar
  repo-url: https://github.com/sciaid/visualize-glider-data-site
  repo-actions: [source, issue]
  navbar:
    right:
      - icon: github
        href: https://github.com/sciaid/visualize-glider-data-site
        aria-label: Source code on GitHub
    left:
      - href: index.qmd
        text: Overview
      - href: deployments.qmd
        text: Deployments
      - href: realtime.qmd
        text: Real-time
      - href: viewer.qmd
        text: Curtain viewer
      - href: methods.qmd
        text: Methods
  page-footer:
    # last commit to this repository (shields.io badge, updated live). Raw HTML: a Markdown image on
    # its own becomes a figure, and its alt text was shown again under it as a caption.
    right: '<a href="https://github.com/sciaid/visualize-glider-data-site/commits/main"><img src="https://img.shields.io/github/last-commit/sciaid/visualize-glider-data-site" alt="last commit" style="vertical-align:middle"></a>'
    center: "Glider data: NOAA SWFSC Ecosystem Science Division Glider Team (CC0-1.0), via the IOOS Glider Data Assembly Center. Bathymetry: GEBCO_2026 Grid. Ocean currents: generated using E.U. Copernicus Marine Service Information; NOAA WCOFS; HF radar from CORDC/Scripps via NOAA CoastWatch; glider depth-averaged currents via the IOOS Glider DAC; MUR SST (NASA JPL) via NOAA CoastWatch; Copernicus-GlobColour chlorophyll."

format:
  html:
    theme: cosmo
    toc: false
