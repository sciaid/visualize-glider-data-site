project:
  type: website
  output-dir: _site
  # Pre-built pages and data, copied into the site as they are
  resources:
    - "map/**"
    - "viewer/**"
    - "realtime_map/**"
    - "currents/**"

website:
  title: "ESD glider deployments"
  # "View source" and "Report an issue" links on every page, and a GitHub icon in the top bar
  repo-url: https://github.com/sciaid/visualize-glider-data-site
  repo-actions: [source, issue]
  navbar:
    right:
      - icon: github
        href: https://github.com/sciaid/visualize-glider-data-site
        aria-label: Source code on GitHub
    left:
      - href: index.qmd
        text: Overview
      - href: deployments.qmd
        text: Deployments
      - href: realtime.qmd
        text: Real-time
      - href: viewer.qmd
        text: Curtain viewer
      - href: methods.qmd
        text: Methods
  page-footer:
    center: "Glider data: NOAA SWFSC Ecosystem Science Division Glider Team (CC0-1.0), via the IOOS Glider Data Assembly Center. Bathymetry: GEBCO_2026 Grid. Ocean currents: generated using E.U. Copernicus Marine Service Information; NOAA WCOFS; HF radar from CORDC/Scripps via NOAA CoastWatch."

format:
  html:
    theme: cosmo
    toc: false
